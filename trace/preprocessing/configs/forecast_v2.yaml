schema_version: '2.0.0'
inputs:
  highres: /home/work/AIDC/trace/dataset/High-resolution-AI-Data-Center-Training-Workloads-Dataset
  nlr: /home/work/AIDC/trace/dataset/nlr_312/extracted
datasets: [highres_node, highres_single, nlr_training, nlr_online_rate, nlr_offline, nlr_online_finite]
analysis:
  gap_multiplier: 5.0
resolutions:
  intervals_s: [0.1, 0.2, 1.0]
  min_coverage: 1.0
  partial_policy: drop
forecast:
  splits:
    protocols: [within_run, held_out_group]
    fractions: [0.6, 0.2, 0.2]
    seed: 20260916
    import_manifest: null
  windows:
    - {context_s: 10.0, horizon_s: 5.0, output_interval_s: 1.0, stride_s: 5.0, resolution_s: 1.0, target_definition: future_trajectory}
    - {context_s: 10.0, horizon_s: 2.0, output_interval_s: 0.2, stride_s: 2.0, resolution_s: 0.2, target_definition: future_trajectory}
  normalization: train_zscore
events:
  enabled: false
  resolution_s: 1.0
detector:
  delta_event_s: [1.0]
  relative_drop_thresholds: [0.2]
  absolute_drop_w: 50.0
  baseline_window_s: 10.0
  baseline_stability_mad_fraction: 0.08
  low_persistence_s: 1.0
  recovery_fraction: 0.9
  recovery_persistence_s: 0.5
  noise_median_window_s: 0.2
  min_valid_coverage: 0.8
plots:
  max_full_points: 5000
